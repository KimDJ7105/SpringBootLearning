<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
  <div th:fragment="content">
      <table>
          <tr>
              <th>번호</th>
              <th>아이디</th>
              <th>할일</th>
              <th>마감일</th>
              <th>완료여부</th>
              <th>수정</th>
              <th>삭제</th>
          </tr>
          <tr th:each="todo : ${todoList}">
              <td th:text="*{todo.id}"></td>
              <td th:text="*{todo.userid}"></td>
              <td th:text="*{todo.description}"></td>
              <td th:text="*{todo.targetDate}"></td>
              <td th:text="*{todo.done}"></td>
              <td>
                  <a th:href="@{/todo-update(id=${todo.id})}" th:text="수정"></a>
              </td>
              <td>
                  <form th:action="@{/todo-delete}" method="post" style="display:inline;">
                      <input type="hidden" name="id" th:value="${todo.id}">
                      <button type="submit">삭제</button>
                  </form>
              </td>
          </tr>
      </table>
      <a th:href="@{/todo-add}">todo 작성</a>
  </div>
</body>
</html>
